id = "wudaozi.pojo-to-json"
name = "POJO to JSON"
version = "0.2.2"
description = "Copy a Java POJO's fields as a JSON skeleton with type-based defaults, inheritance and Jackson naming."
authors = ["wudaozi"]
license = "Apache-2.0"
categories = ["tools"]
engines.openidea = "^1.8"
wasm = "dist/plugin.wasm"
icon = "icon.svg"
homepage = "https://github.com/Wu-Daozi/openidea-pojo-to-json"
change-notes = """0.2.2 — honor the single-string @JsonIgnoreProperties form ("name" and value = "name").
0.2.1 — inherit Jackson naming/ignores correctly, per-file import resolution, omit @JsonIgnoreType fields, faster JDK-type handling and safer candidate selection.
0.2.0 — import-aware type resolution, inherited fields, Jackson naming/ignore annotations, configurable output and preview.
0.1.0 — first release: copy a Java POJO as a JSON skeleton."""
activation = ["on-command:copy-json"]

[capabilities]
required = ["editor.read", "clipboard", "project.read"]

[[contributes.commands]]
id = "copy-json"
title = "Copy JSON"
category = "POJO to JSON"
when = "editorLangId == java"

[[contributes.menus]]
menu = "editor.context"
command = "copy-json"
when = "editorLangId == java"

[contributes.settings]
title = "POJO to JSON"
schema = "settings.schema.json"
